{% extends "layout.html" %}
{% block content %}
<div class="container">
    <h2>Apply for Access</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-messages">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Corporate Email" required>
        <input type="password" name="password" id="password" placeholder="Password (min 8 chars)" required oninput="checkStrength(this.value)">
        <div class="strength-bar"><div id="strengthFill"></div></div>
        <p id="strengthText" style="font-size:0.78rem; margin-top:2px;"></p>

        <label for="role">Select Your Role:</label>
        <select name="role" id="role" required>
            <option value="">-- Select Role --</option>
            <option value="Employee">Employee (Email OTP Verification)</option>
            <option value="Security Analyst">Security Analyst (OTP + Admin Approval)</option>
            <option value="Admin">Admin / Asst. Manager (OTP + Super Admin Approval)</option>
            <option value="Super Admin">Super Admin / Manager (OTP + Manual Approval)</option>
        </select>

        <button type="submit" class="btn">Apply for Access</button>
    </form>

    <p class="login-link">Already have access? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
<script>
function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    const colors = ['#da251d','#f0a500','#f0a500','#4caf50','#2e7d32'];
    const labels = ['','Weak','Fair','Good','Strong'];
    fill.style.width = (score * 25) + '%';
    fill.style.background = colors[score];
    text.textContent = labels[score];
    text.style.color = colors[score];
}
</script>
{% endblock %}
