{% extends "layout.html" %}
{% block content %}
<div class="container">
    <h2>Royal Challengers Registration</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Corporate Email" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <label>Select Your Department:</label>
        <select name="role">
            <option value="Employee">Employee (Requires Email OTP)</option>
            <option value="Security Analysis">Security Analysis (Requires Admin Approval)</option>
            <option value="Admin">System Administrator (Requires Admin Approval)</option>
        </select>
        
        <button type="submit" class="btn">Apply for Access</button>
    </form>
    <p>Already have access? <a href="/login">Login here</a></p>
</div>
{% endblock %}
