{% extends "layout.html" %}
{% block content %}
<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #da251d;">Royal Challengers Login</h2>
        <p>Enter your corporate credentials to access the portal.</p>
    </div>

    <form method="POST">
        <label>Corporate Email</label>
        <input type="email" name="email" placeholder="email@royalchallengers.com" required>
        
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        
        <button type="submit" class="btn">Access Portal</button>
    </form>

    <div style="margin-top: 20px; text-align: center; border-top: 1px solid #ddd; padding-top: 10px;">
        <p>New to the team? <a href="/register" style="color: #c6a15b;">Register here</a></p>
        <p style="font-size: 0.8rem; color: #666;">Note: Admin & Security roles require manual activation via SOC.</p>
    </div>
</div>
{% endblock %}
