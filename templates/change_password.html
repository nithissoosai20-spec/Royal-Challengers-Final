{% extends "layout.html" %}
{% block content %}
<div class="container" style="max-width:440px;">
    <h2>🔑 Change Password</h2>
    <p style="color:#aaa; font-size:0.88rem; margin-bottom:20px;">Your password has expired or you requested a change. Please set a new password.</p>
    <form method="POST">
        <label>New Password</label>
        <input type="password" name="password" id="password" placeholder="Min 8 characters" required oninput="checkStrength(this.value)">
        <div class="strength-bar"><div id="strengthFill"></div></div>
        <p id="strengthText" style="font-size:0.78rem; margin-top:2px;"></p>
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required>
        <button type="submit" class="btn" style="width:100%; margin-top:12px;">Update Password</button>
    </form>
</div>
<script>
function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    const colors = ['#da251d','#f0a500','#f0a500','#4caf50','#2e7d32'];
    const labels = ['','Weak','Fair','Good','Strong'];
    fill.style.width = (score * 25) + '%';
    fill.style.background = colors[score];
    text.textContent = labels[score];
    text.style.color = colors[score];
}
</script>
{% endblock %}
